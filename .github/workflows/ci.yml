name: CI
on:
  push:
    branches: [main, feat/v1-portable]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Rebuild source-grounded fixtures and artifacts
        run: |
          python examples/build_seed.py
          python tools/build_artifacts.py
          python examples/build_operational_games.py
      - name: Tests, schema and canonical graph
        run: |
          python -m pytest -q
          inquiry-graph validate examples/seed/graph.json
          inquiry-graph validate examples/operational-games-2026-09-30/graph.json
          python tools/build_artifacts.py --check
          git diff --exit-code -- schemas examples/seed examples/operational-games-2026-09-30
          python -m pip check
