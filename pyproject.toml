[build-system]
requires = ["setuptools>=70,<84"]
build-backend = "setuptools.build_meta"

[project]
name = "inquiry-graph"
version = "1.0.0"
description = "Source-grounded, attributed inquiry graphs from conversations"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.11,<3", "networkx>=3.4,<4"]

[project.optional-dependencies]
llm = ["llm-client @ git+https://github.com/BrianMills2718/llm_client.git@2e544d66641a3b9f00d2df540ed2a32d086e819e"]
warrant = ["epistemic-warrant @ git+https://github.com/BrianMills2718/epistemic-warrant.git@0f0405b2f8ed75d3f1bdda489ecd5d9e79abed3c"]
dev = ["pytest>=8,<10", "jsonschema>=4.23,<5", "rank-bm25>=0.2.2,<0.3"]

[project.scripts]
inquiry-graph = "inquiry_graph.cli:main"
ig = "inquiry_graph.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
