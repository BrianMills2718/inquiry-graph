  - heuristic_id: H3
    disposition: applied
    rationale: The side panel shows the exact quote, its source app, date and kind of statement before any topic interpretation.
    evidence_refs:
      - map-browser
  - heuristic_id: H4
    disposition: applied
    rationale: No node-link graph is drawn; a 2-D semantic map with a nested topic list answers "what have I talked about and where" better than edges would.
