  - heuristic_id: H11
    disposition: applied
    rationale: Points that fit no topic stay visible in grey, labelled Unlabelled, and the subtitle says so; nothing is dropped from the map except records without a usable embedding.
    evidence_refs:
      - map-source
      - map-browser
  - heuristic_id: H13
    disposition: applied
    rationale: The subtitle states that topic names are the topics' top keywords, not summaries.
    evidence_refs:
      - map-source
  - heuristic_id: H14
    disposition: applied
    rationale: The colouring menu switches between topic level, coding session or chat, app, and kind of statement without changing positions or the open selection.
